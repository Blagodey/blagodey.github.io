:root{--bg:#080808;--card:#131317;--line:#22222a;--txt:#f2f2f6;--mut:#a7a7b4;--mag:#ff5500;--cy:#00e5ff}

body{margin:0;background:var(--bg);color:var(--txt);font-family:Rajdhani,"Exo 2",system-ui,sans-serif;font-size:18px;line-height:1.5}
a{color:inherit}
.mono{font-family:"Share Tech Mono","JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-weight:700;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
.logo b{color:var(--mag)}
.lng{display:flex;gap:6px}
@media(max-width:640px){.lng{gap:3px!important}.lng button{padding:3px 6px!important;font-size:12px!important}}
.lng button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 9px;font:inherit;font-size:14px;cursor:pointer}
.lng button.on{border-color:var(--mag);color:#fff}
.hero{padding-top:56px;padding-bottom:30px}
.k{color:var(--mag);font-size:12px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.02;margin:10px 0 14px}
.lead{color:var(--mut);max-width:760px;font-size:20px;margin:0 0 22px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt)}
.btn.p{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.yt{background:#ff0033;border-color:#ff0033;color:#fff}
.btn:hover{border-color:var(--cy)}
section{padding:26px 0}
h2{font-size:clamp(26px,4vw,38px);margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 18px}
.songs{display:grid;gap:12px}
.song{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.song img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}
.song h3{margin:0;font-size:20px}
.song .m{color:var(--mut);font-size:15px}
.song .a{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--mut)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.v{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;color:inherit;font:inherit;padding:0;cursor:pointer;display:flex;flex-direction:column}
.v:hover{border-color:var(--cy)}
.v .th{position:relative;aspect-ratio:16/9;background:#000}
.v .th img{width:100%;height:100%;object-fit:cover;display:block}
.v .d{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);border-radius:6px;padding:1px 7px;font-size:13px}
.v .tx{padding:10px 12px 14px}
.v h3{font-size:17px;line-height:1.25;margin:0 0 6px}
.v .m{color:var(--mut);font-size:13px}
.more{display:flex;justify-content:center;margin-top:18px}
footer{border-top:1px solid var(--line);margin-top:30px;padding:24px 0 40px;color:var(--mut);font-size:15px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{width:min(1000px,100%)}
.mbox .fr{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.mbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mbar .t{font-weight:700}
@media(max-width:640px){.song{grid-template-columns:96px minmax(0,1fr)}.song img{width:96px}.song .a{grid-column:1/-1;justify-content:flex-start}.hero{padding-top:36px!important}}
.gh{margin:28px 0 10px;font-size:20px;color:#ff5500}.gh span{font-size:13px;color:var(--mut,#9a9aa8);margin-left:6px}
#songs{padding-top:96px}@media(max-width:640px){#songs{padding-top:84px}}</style>

  $("songs-list").innerHTML=SONGS.length?SONGS.map((x,i)=>{const v=vById[x.v];const gh=(i===0||SONGS[i-1].n!==x.n)?`<h2 class="gh">${esc(nm(x.n))} <span>${SONGS.filter(y=>y.n===x.n).length}</span></h2>`:"";return gh+`<div class="song"><img loading="lazy" src="${thumb(x.v)}" alt=""><div><h3>${esc(nm(x.n))}</h3><div class="m">${x.s}–${x.e} · ${T[L].in} «${esc(v?v[1]:x.v)}»</div></div><div class="a"><button class="btn p" data-seg="${i}">${T[L].seg}</button>${x.sc?`<a class="btn" href="./?play=${encodeURIComponent(x.sc)}">${T[L].listen}</a>`:""}<a class="btn" target="_blank" rel="noopener" href="https://youtu.be/${x.v}?t=${sec(x.s)}">${T[L].full}</a></div></div>`}).join(""):`<div class="empty">${T[L].empty}</div>`;
  $("vgrid").innerHTML=VIDS.slice(0,shown).map(v=>`<button class="v" data-v="${v[0]}"><div class="th"><img loading="lazy" src="${thumb(v[0])}" alt=""><span class="d">${v[3]}</span></div><div class="tx"><h3>${esc(v[1])}</h3><div class="m mono">${new Date(v[2]).toLocaleDateString(L==="uk"?"uk-UA":L,{day:"numeric",month:"short",year:"numeric"})}</div></div></button>`).join("");
  $("vgrid").nextElementSibling.querySelector(".btn").textContent=T[L].v_all;
}
function openV(id,start,end,title){
  let q="autoplay=1&rel=0&modestbranding=1";if(start)q+="&start="+start;if(end)q+="&end="+end;
  $("mFr").innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?${q}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  $("mT").textContent=title||"";$("mFull").href=`https://youtu.be/${id}${start?"?t="+start:""}`;$("mFull").textContent=T[L].full;$("modal").classList.add("on");
}
function closeV(){$("modal").classList.remove("on");$("mFr").innerHTML=""}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-seg]");if(s){const x=SONGS[+s.dataset.seg];openV(x.v,sec(x.s),sec(x.e),nm(x.n));return}
  const v=e.target.closest("[data-v]");if(v){openV(v.dataset.v,0,0,(vById[v.dataset.v]||[])[1]);return}
  const l=e.target.closest(".lng button");if(l){L=l.dataset.l;try{localStorage.setItem("bl_lang",L)}catch(_){}render();if(window.BLChat)BLChat.setLang(L);return}
  if(e.target.id==="mX"||e.target.id==="modal")closeV();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeV()});
$("yr").textContent=new Date().getFullYear();
render();
</script>
