name: Update media list
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_media.py
      - name: Commit if changed
        run: |
          git config user.name "blagoday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media.json
          git diff --cached --quiet || (git commit -m "Auto-update media list" && git push)
